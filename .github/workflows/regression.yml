name: Regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest
      - run: python scripts/validate_zero_supabase_data.py
      - run: node --check static/js/site-carousel.js
      - run: node --check static/js/model-narration.js
      - run: node --check static/js/admin-dashboard.js

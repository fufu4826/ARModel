{# Same main menu on every public page. Set nav_active to home / projects / models / centre. #}

  <button class="mobile-nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" data-mobile-nav-toggle aria-label="เปิดเมนูนำทาง">

    เมนู
  </button>
  <nav class="nav-actions" id="nav-menu" aria-label="ลิงก์หลัก">

    <a href="{{ url_for('home') }}#projects"{% if nav_active == 'projects' %} aria-current="page"{% endif %}>แหล่งเรียนรู้</a>

    <a href="{{ url_for('home') }}#phuphan-centre">รู้จักศูนย์ภูพาน / ติดต่อ</a>

<!DOCTYPE html>
<html lang="th" data-admin-read-only="{{ 'true' if admin_read_only else 'false' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แก้ไขข่าว - ระบบจัดการ {{ brand_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css', v='20261127w') }}" />
  {% include "_fonts.html" %}
</head>
<body>
  <div class="admin-container">
    {% include "_admin_nav.html" %}

    <main class="admin-main-content">
      <div class="admin-shell news">
        <header class="admin-heading">
          <div>
            <p class="admin-eyebrow"><a href="{{ url_for('admin_sliders') }}">ข่าวสาร</a> / แก้ไข</p>
            <h1>{{ slider.title }}</h1>
            <p>แก้ไขแล้วกด “บันทึก” ที่แถบด้านล่าง</p>
          </div>
        </header>

        {% include "_admin_messages.html" %}

        <form action="{{ url_for('edit_slider', slider_id=slider.id) }}" method="post" enctype="multipart/form-data" class="admin-card news-edit">
          {% with prefix='slider' %}{% include "_slider_form.html" %}{% endwith %}
          <div class="admin-action-row full admin-savebar">
            <span class="admin-savebar__hint">การแก้ไขจะยังไม่ถูกบันทึกจนกว่าจะกดบันทึก</span>
            <a class="button secondary" href="{{ url_for('admin_sliders') }}">ยกเลิก</a>
            <button class="button" type="submit">บันทึก</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/image-preview.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/admin-sliders.js', v='1') }}" defer></script>
</body>
</html>
